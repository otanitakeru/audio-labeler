services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # 文字起こしのモデル(1GB以上)を、イメージを作り直しても再ダウンロードしないよう残す
      - hf-cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  hf-cache:
